plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
}

android {
  namespace 'com.aesphome'
  compileSdk 34

  defaultConfig {
    applicationId "com.aesphome"
    minSdk 22
    targetSdk 34
    versionCode 24
    versionName "2026.9.11"
  }

  // Only configured when a keystore is actually present (release.yml decodes
  // ANDROID_KEYSTORE_BASE64 to this path when that secret is set) — with no keystore file,
  // signingConfigs stays empty and assembleRelease falls back to AGP's normal unsigned
  // output, exactly as it did before this block existed. No secret is ever required for a
  // debug build, and none of these values are ever logged.
  def releaseKeystoreFile = file("${rootDir}/release.keystore")
  def hasReleaseKeystore = releaseKeystoreFile.exists()

  signingConfigs {
    if (hasReleaseKeystore) {
      release {
        storeFile releaseKeystoreFile
        storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
        keyAlias System.getenv("ANDROID_KEY_ALIAS")
        keyPassword System.getenv("ANDROID_KEY_PASSWORD")
      }
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      if (hasReleaseKeystore) {
        signingConfig signingConfigs.release
      }
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  buildFeatures {
    buildConfig true
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  // Keeps the bundled TFLite model (assets/efficientdet_lite0.tflite, ~4.3MB) uncompressed in
  // the APK — TFLite's Task Library memory-maps the model file directly; a compressed asset
  // would need to be copied out and decompressed before it could be loaded.
  aaptOptions {
    noCompress "tflite"
  }
}

dependencies {
  implementation 'org.videolan.android:libvlc-all:3.7.0'
  // FileProvider only — the small, foundational compat library, not a UI/heavy framework
  // dependency. Needed to hand a downloaded update APK to the system installer without
  // exposing a raw file:// path (blocked by StrictMode on API 24+).
  implementation 'androidx.core:core:1.13.1'
  // Modernizes the hand-built settings/permissions/app-picker screens (MaterialSwitch,
  // MaterialButton, MaterialCardView, TextInputLayout) — standard, small (~1-2MB), and
  // present on virtually every modern Android app; no custom widget set was written instead.
  // Pinned to 1.12.0, not the current latest (1.14.0): 1.13+ pulls in androidx.core 1.16.0,
  // which requires compileSdk 35 + AGP 8.6+ — a larger, separate change from "add Material
  // Components" that wasn't made in this pass.
  implementation 'com.google.android.material:material:1.12.0'
  // Person-presence detection (sensors/person_detector.kt) — the high-level Task Library API
  // (not the raw Interpreter API) so this app doesn't hand-roll anchor decoding/NMS; CPU-only
  // (no tensorflow-lite-gpu) since the GPU delegate's device/driver compatibility is far less
  // predictable than CPU across the old/low-end Android hardware this project targets.
  implementation 'org.tensorflow:tensorflow-lite-task-vision:0.4.4'
  // Sound event classification (sensors/sound_classifier.kt) — NOT tensorflow-lite-task-audio
  // (the Task Library's high-level AudioClassifier): its native init
  // (initJniWithModelFdAndOptions, libtask_audio_jni.so) segfaults loading this exact,
  // officially-published model on this device — confirmed live (SIGABRT, "invalid address
  // passed to free"), a real, known-flaky native library (see
  // github.com/tensorflow/tensorflow/issues/96401 for a related libtask_audio_jni.so
  // instability report). Using the core Interpreter runtime directly instead sidesteps that
  // specific native code path entirely — YAMNet's input/output are both plain flat
  // float32 tensors (see the model's own metadata), simple enough to drive by hand.
  // tensorflow-lite-support (not just the -api stub task-vision/task-audio pull in
  // transitively) for MetadataExtractor, to read the bundled label list — the one part of
  // the old approach worth keeping, since it's a pure-Java reader, not native code.
  // Interpreter itself; FileUtil (org.tensorflow.lite.support.common) comes transitively via
  // tensorflow-lite-task-vision's own tensorflow-lite-support-api dependency above, already
  // present — no separate tensorflow-lite-support needed for that.
  implementation 'org.tensorflow:tensorflow-lite:2.13.0'
  // MetadataExtractor (org.tensorflow.lite.support.metadata) — reads yamnet.tflite's bundled
  // label list; lives in this artifact specifically, not tensorflow-lite-support-api.
  implementation 'org.tensorflow:tensorflow-lite-metadata:0.4.4'
  // Noise Protocol Framework (ESPHome's encrypted API transport, noise.kt) — a small,
  // purpose-built pure-Java implementation of the actual protocol state machine (handshake
  // patterns, symmetric/cipher state, split()), not just raw crypto primitives, so this
  // doesn't mean hand-rolling the Noise handshake itself. No Maven Central artifact exists;
  // pinned to a specific commit via JitPack since upstream has no tagged releases.
  implementation 'com.github.rweather:noise-java:49377b6dfc6a1e75740bce2318118291a57c0d6e'
  testImplementation 'junit:junit:4.13.2'
}

