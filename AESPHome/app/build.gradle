plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
}

android {
  namespace 'com.aesphome'
  compileSdk 34

  defaultConfig {
    applicationId "com.aesphome"
    minSdk 22
    targetSdk 34
    versionCode 6
    versionName "0.2.3"
  }

  // Only configured when a keystore is actually present (release.yml decodes
  // ANDROID_KEYSTORE_BASE64 to this path when that secret is set) — with no keystore file,
  // signingConfigs stays empty and assembleRelease falls back to AGP's normal unsigned
  // output, exactly as it did before this block existed. No secret is ever required for a
  // debug build, and none of these values are ever logged.
  def releaseKeystoreFile = file("${rootDir}/release.keystore")
  def hasReleaseKeystore = releaseKeystoreFile.exists()

  signingConfigs {
    if (hasReleaseKeystore) {
      release {
        storeFile releaseKeystoreFile
        storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
        keyAlias System.getenv("ANDROID_KEY_ALIAS")
        keyPassword System.getenv("ANDROID_KEY_PASSWORD")
      }
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      if (hasReleaseKeystore) {
        signingConfig signingConfigs.release
      }
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  buildFeatures {
    buildConfig true
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  // Keeps the bundled TFLite model (assets/efficientdet_lite0.tflite, ~4.3MB) uncompressed in
  // the APK — TFLite's Task Library memory-maps the model file directly; a compressed asset
  // would need to be copied out and decompressed before it could be loaded.
  aaptOptions {
    noCompress "tflite"
  }
}

dependencies {
  implementation 'org.videolan.android:libvlc-all:3.7.0'
  // FileProvider only — the small, foundational compat library, not a UI/heavy framework
  // dependency. Needed to hand a downloaded update APK to the system installer without
  // exposing a raw file:// path (blocked by StrictMode on API 24+).
  implementation 'androidx.core:core:1.13.1'
  // Person-presence detection (sensors/person_detector.kt) — the high-level Task Library API
  // (not the raw Interpreter API) so this app doesn't hand-roll anchor decoding/NMS; CPU-only
  // (no tensorflow-lite-gpu) since the GPU delegate's device/driver compatibility is far less
  // predictable than CPU across the old/low-end Android hardware this project targets.
  implementation 'org.tensorflow:tensorflow-lite-task-vision:0.4.4'
  testImplementation 'junit:junit:4.13.2'
}

