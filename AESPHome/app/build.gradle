plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
}

android {
  namespace 'com.aesphome'
  compileSdk 34

  defaultConfig {
    applicationId "com.aesphome"
    minSdk 22
    targetSdk 34
    versionCode 2
    versionName "0.1.0"
  }

  // Only configured when a keystore is actually present (release.yml decodes
  // ANDROID_KEYSTORE_BASE64 to this path when that secret is set) — with no keystore file,
  // signingConfigs stays empty and assembleRelease falls back to AGP's normal unsigned
  // output, exactly as it did before this block existed. No secret is ever required for a
  // debug build, and none of these values are ever logged.
  def releaseKeystoreFile = file("${rootDir}/release.keystore")
  def hasReleaseKeystore = releaseKeystoreFile.exists()

  signingConfigs {
    if (hasReleaseKeystore) {
      release {
        storeFile releaseKeystoreFile
        storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
        keyAlias System.getenv("ANDROID_KEY_ALIAS")
        keyPassword System.getenv("ANDROID_KEY_PASSWORD")
      }
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      if (hasReleaseKeystore) {
        signingConfig signingConfigs.release
      }
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  buildFeatures {
    buildConfig true
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

dependencies {
  implementation 'org.videolan.android:libvlc-all:3.7.0'
  testImplementation 'junit:junit:4.13.2'
}

