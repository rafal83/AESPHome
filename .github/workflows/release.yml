name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: android-release-${{ github.ref }}
  # Never cancel a release run already in progress — unlike the CI build workflow, a
  # cancelled release could leave a partially-published GitHub Release (e.g. the APK
  # uploaded but its checksum not) with no automatic cleanup.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: AESPHome

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Catches the mistake of tagging a release without bumping app/build.gradle first —
      # otherwise the published APK's filename (and the tag/GitHub Release) says one version
      # while BuildConfig.VERSION_NAME (what the app reports to HA and compares against for
      # auto-update) says another.
      - name: Verify tag matches app/build.gradle versionName
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          gradle_version=$(grep -m1 'versionName' app/build.gradle | sed -E 's/.*versionName "([^"]+)".*/\1/')
          if [ "$tag_version" != "$gradle_version" ]; then
            echo "::error::Tag v$tag_version does not match app/build.gradle versionName \"$gradle_version\" — bump versionName before tagging."
            exit 1
          fi
          echo "Tag and versionName agree: $tag_version"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest --stacktrace

      # No signing keystore is committed to this repo (and never should be — see
      # docs/IMPLEMENTATION_REPORT.md's CI section). When the ANDROID_KEYSTORE_BASE64 secret
      # isn't configured, assembleRelease still runs and AGP produces an unsigned release
      # build; it's packaged and released clearly labeled as unsigned, and as a GitHub
      # prerelease (see the Create GitHub Release step below) rather than silently skipped,
      # so a maintainer always gets an artifact from every tag — but the in-app auto-updater
      # (auto_update.kt) refuses to ever select an unsigned/debug asset for a real update.
      - name: Decode signing keystore (if configured)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build release APK
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Package APK with version in its name
        id: apk
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p artifact
          suffix="release"
          if [ "${HAS_KEYSTORE:-false}" != "true" ]; then suffix="unsigned"; fi
          name="AESPHome-${version}-${suffix}.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "artifact/${name}" 2>/dev/null || \
          cp app/build/outputs/apk/release/app-release.apk "artifact/${name}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "path=AESPHome/artifact/${name}" >> "$GITHUB_OUTPUT"
          echo "suffix=${suffix}" >> "$GITHUB_OUTPUT"
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

      # Confirms the APK is actually signed with a valid scheme before it's ever published —
      # catches a broken/mismatched signing config that assembleRelease alone doesn't
      # necessarily fail on. Only runs when a keystore was configured; skipped (with a
      # warning, not a failure) if this runner's Android SDK has no build-tools with
      # apksigner, since that's an environment gap, not evidence of a bad signature.
      - name: Verify APK signature
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          apksigner_bin=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -maxdepth 2 -name apksigner 2>/dev/null | sort -V | tail -n1)
          if [ -z "$apksigner_bin" ]; then
            echo "::warning::apksigner not found in this runner's Android SDK — skipping signature verification"
            exit 0
          fi
          echo "Using $apksigner_bin"
          "$apksigner_bin" verify --print-certs "${{ steps.apk.outputs.path }}"

      - name: Compute SHA-256 checksum
        run: |
          cd artifact
          sha256sum "${{ steps.apk.outputs.name }}" > "${{ steps.apk.outputs.name }}.sha256"
          cat "${{ steps.apk.outputs.name }}.sha256"

      # Never leave the decoded keystore lying around on the runner's disk past this job —
      # `if: always()` so this still runs even if an earlier step failed.
      - name: Destroy signing keystore
        if: always()
        run: rm -f release.keystore

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.sha256
          prerelease: ${{ steps.apk.outputs.suffix == 'unsigned' }}
          body: ${{ steps.apk.outputs.suffix == 'unsigned' && '**Unsigned build** — no signing keystore was configured for this workflow run. This APK cannot be installed as an update over an existing signed install, and is not the official release artifact.' || '' }}
          generate_release_notes: true
