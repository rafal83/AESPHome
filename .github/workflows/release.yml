name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: AESPHome

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest --stacktrace

      # No signing keystore is committed to this repo (and never should be — see
      # docs/IMPLEMENTATION_REPORT.md's CI section). When the ANDROID_KEYSTORE_BASE64 secret
      # isn't configured, assembleRelease still runs and AGP produces an unsigned release
      # build; it's packaged and released clearly labeled as unsigned rather than silently
      # skipped, so a maintainer always gets an artifact from every tag.
      - name: Decode signing keystore (if configured)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build release APK
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Package APK with version in its name
        id: apk
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p artifact
          suffix="release"
          if [ "${HAS_KEYSTORE:-false}" != "true" ]; then suffix="unsigned"; fi
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
             "artifact/AESPHome-${version}-${suffix}.apk" 2>/dev/null || \
          cp app/build/outputs/apk/release/app-release.apk \
             "artifact/AESPHome-${version}-${suffix}.apk"
          echo "path=AESPHome/artifact/AESPHome-${version}-${suffix}.apk" >> "$GITHUB_OUTPUT"
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
