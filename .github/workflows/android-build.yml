name: Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: AESPHome

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK with version
        id: apk
        run: |
          version=$(grep -m1 'versionName' app/build.gradle | sed -E 's/.*versionName "([^"]+)".*/\1/')
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk "artifact/AESPHome-${version}-debug.apk"
          echo "path=AESPHome/artifact/AESPHome-${version}-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AESPHome-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
